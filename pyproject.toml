[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "srp"
version = "0.1.0"
description = "A MCP server for SRP"
authors = [
    { name = "Archit", email = "architagrawal000@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
srp = "srp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/srp"]
